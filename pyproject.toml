[project]
name = "portinhola"
version = "0.1.0"
description = "Self-hosted dashboard for Portuguese household utilities (electricity, gas, water)"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "pydantic-settings>=2.7",
  "argon2-cffi>=23.1",
  "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.28",
  "ruff>=0.9",
  "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["portinhola"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: `Depends(...)` in argument defaults is the standard FastAPI idiom.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
