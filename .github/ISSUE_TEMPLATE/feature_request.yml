name: Feature request
description: Something Portinhola should do but doesn't
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that you can't today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you'd solve it
      description: Optional. Rough ideas welcome.
